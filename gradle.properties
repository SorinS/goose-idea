pluginVersion=0.3.2
pluginSinceBuild=262

# The IDE the plugin is built against, run in (runIde) and verified against.
# The default is the IntelliJ IDEA installed on macOS; override it with
# -PplatformLocalPath=... or in ~/.gradle/gradle.properties.
platformLocalPath=/Applications/IntelliJ IDEA.app

# The platform's classes are Java 25 bytecode, so compiling against them
# takes a JDK 25 toolchain (the plugin's own bytecode stays Java 21). The
# IDE's bundled runtime is one; Gradle itself runs on any Java 17 or later.
# Override it in ~/.gradle/gradle.properties for a JDK 25 elsewhere.
org.gradle.java.installations.paths=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

org.gradle.configuration-cache=true
org.gradle.caching=true
