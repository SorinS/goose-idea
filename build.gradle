import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    // The version is the settings plugin's, in settings.gradle.
    id 'org.jetbrains.intellij.platform'
}

group = 'io.github.sorins.goose'
version = providers.gradleProperty('pluginVersion').get()

java {
    // The 2026.2 platform runs on Java 25 (its bundled JBR); Java 21
    // bytecode is what the platform's own plugins target.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

dependencies {
    intellijPlatform {
        local(providers.gradleProperty('platformLocalPath'))
        bundledPlugin('org.jetbrains.plugins.textmate')
        // The platform's DAP client (experimental API) for Goose debugging.
        bundledModule('intellij.platform.dap')
        testFramework(TestFrameworkType.Platform.INSTANCE)
    }
    testImplementation 'junit:junit:4.13.2'
    // The platform's test framework needs it on JUnit 4 runs.
    testRuntimeOnly 'org.opentest4j:opentest4j:1.3.0'
}

intellijPlatform {
    pluginConfiguration {
        version = providers.gradleProperty('pluginVersion')
        ideaVersion {
            sinceBuild = providers.gradleProperty('pluginSinceBuild')
            untilBuild = provider { null }
        }
    }
    pluginVerification {
        ides {
            local(file(providers.gradleProperty('platformLocalPath').get()))
            // Also the other installed IDEs the plugin is meant for, where present
            // (-PverifyIdes=/path/A.app,/path/B.app replaces the list).
            providers.gradleProperty('verifyIdes').getOrElse('/Applications/GoLand.app,/Applications/CLion.app')
                    .split(',').collect { it.trim() }.findAll { it && file(it).exists() }
                    .each { local(file(it)) }
        }
    }
    buildSearchableOptions = false
}

// The TextMate bundle (grammar, language configuration, snippets) is read by
// the TextMate plugin from a directory on disk, so it ships next to lib/ in
// the plugin's directory rather than inside the jar.
// goose_lldb.py (the LLDB formatters and goose-* commands that raw lldb-dap
// loads through initCommands) ships the same way, as lldb/goose_lldb.py.
tasks.named('prepareSandbox') {
    from(layout.projectDirectory.dir('textmate')) {
        into(intellijPlatform.projectName.map { "$it/textmate" })
    }
    from(layout.projectDirectory.dir('lldb')) {
        into(intellijPlatform.projectName.map { "$it/lldb" })
    }
}
tasks.named('prepareTestSandbox') {
    from(layout.projectDirectory.dir('textmate')) {
        into(intellijPlatform.projectName.map { "$it/textmate" })
    }
    from(layout.projectDirectory.dir('lldb')) {
        into(intellijPlatform.projectName.map { "$it/lldb" })
    }
}

// The copy in lldb/ is vendored, so that a build needs nothing outside this
// repository. ./gradlew syncGooseLldb refreshes it from the debugger
// repository (-PgooseLldbSource=path/goose_lldb.py names another copy).
tasks.register('syncGooseLldb', Copy) {
    def source = file(providers.gradleProperty('gooseLldbSource')
            .getOrElse(System.getProperty('user.home') + '/Dev/Goose/goose-debugger.git/lldb/goose_lldb.py'))
    onlyIf { source.isFile() }
    from(source)
    into(layout.projectDirectory.dir('lldb'))
}

def legalFiles = tasks.register('legalFiles', Copy) {
    from(file('LICENSE'), file('NOTICE'))
    into(layout.buildDirectory.dir('legal/META-INF'))
}
sourceSets.main.resources.srcDir(legalFiles.map { layout.buildDirectory.dir('legal').get() })

tasks.named('test') {
    // The headless LSP test runs the compiler when it can find one.
    systemProperty 'goose.compiler', providers.gradleProperty('gooseCompiler').getOrElse('')
    // The headless debugger test builds with a compiler that has -g (goose
    // build --debug-info) and drives lldb-dap, and goose-dap when -PgooseDap
    // names it; each part is skipped without what it needs.
    systemProperty 'goose.debugCompiler', providers.gradleProperty('gooseDebugCompiler').getOrElse('')
    systemProperty 'goose.lldbDap', providers.gradleProperty('lldbDap').getOrElse('')
    systemProperty 'goose.gooseDap', providers.gradleProperty('gooseDap').getOrElse('')
}
